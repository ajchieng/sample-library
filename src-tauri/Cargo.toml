[package]
name = "sample-tracker"
version = "0.1.0"
description = "A local-first sample library manager"
authors = ["Sample Tracker"]
edition = "2021"

[lib]
# The desktop binary calls into this lib; the extra crate-types keep the
# project compatible with Tauri's mobile targets.
name = "sample_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Native OS drag-and-drop so a sample can be dragged out of the app and dropped
# as a real file *copy* into Finder/DAWs (HTML5 drag from the webview isn't
# recognized as a file drag by native apps). The original file is never moved.
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = "0.32"
http-range = "0.1"
percent-encoding = "2"
# Pure-Rust audio decoder. We only probe file headers for metadata (duration,
# sample rate, channels) — never decode or modify the audio. "all" enables every
# format the app can import (wav/mp3/aiff/aif/flac/m4a/ogg) so there are no gaps.
symphonia = { version = "0.6", features = ["all"] }

# macOS-only: write file references to the system pasteboard so "Copy file"
# puts the actual audio file on the clipboard (⌘V into Finder etc.). Versions
# match what Tauri already pulls into Cargo.lock, so there's no extra build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[dev-dependencies]
# Temp directories for unit-testing the library file operations against a real
# filesystem without touching the user's app-config dir.
tempfile = "3"
