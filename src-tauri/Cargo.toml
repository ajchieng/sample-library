[package]
name = "sample-tracker"
version = "0.1.0"
description = "A local-first sample library manager"
authors = ["Sample Tracker"]
edition = "2021"

[lib]
# The desktop binary calls into this lib; the extra crate-types keep the
# project compatible with Tauri's mobile targets.
name = "sample_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
